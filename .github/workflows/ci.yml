name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  api:
    name: API — lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmagic1

      - name: Install API
        working-directory: apps/api
        run: pip install -e ".[dev]" ruff

      - name: Lint
        working-directory: apps/api
        run: ruff check .

      - name: Test
        working-directory: apps/api
        run: pytest -q

  worker:
    name: Worker — tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmagic1 poppler-utils

      - name: Install API (editable dependency of worker)
        working-directory: apps/api
        run: pip install -e .

      - name: Install worker
        working-directory: apps/worker
        run: pip install -e ".[dev]"

      - name: Test
        working-directory: apps/worker
        run: pytest -q

  web:
    name: Web — typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        working-directory: apps/web
        run: npm ci

      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Build
        working-directory: apps/web
        run: npm run build

  migrations:
    name: Alembic migrations against Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ordo
          POSTGRES_PASSWORD: ordo
          POSTGRES_DB: ordo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ordo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmagic1

      - name: Install API
        working-directory: apps/api
        run: pip install -e .

      - name: Run migrations
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://ordo:ordo@localhost:5432/ordo
        run: alembic upgrade head

[project]
name = "ordo-worker"
version = "0.1.0"
description = "Ordo — фоновый воркер (arq)"
requires-python = ">=3.11"
dependencies = [
    "arq>=0.26",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "boto3>=1.34",
    "pgvector>=0.2.5",
    "openai>=1.30",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "python-magic>=0.4.27",
    "pdfplumber>=0.11",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "python-pptx>=1.0",
    "icalendar>=5.0",
    "caldav>=1.3",
    "pillow>=10.3",
    "pillow-heif>=0.16",
    "pdf2image>=1.17",
    "extract-msg>=0.48",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ordo_worker*"]
